<main class="container">
  <div class="card">
    <div class="cat">🐱</div>
    <h1>Buenos días, Rocío</h1>
    <p class="subtitle">
      Solo pasaba a dejarte un detalle rápido hecho con código para que partas bien el día.
    </p>

    @if (!sorpresa) {
      <button (click)="activarSorpresa()">Abrir mensaje ✨</button>
    } @else {
      <div class="secret">
        <p>Espero que tengas un día increíble hoy. Tómate tu agua 💧</p>
      </div>
    }
  </div>
</main>
